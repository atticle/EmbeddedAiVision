<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">ONNX Runtime inference flow</title>
  <desc id="desc">An ONNX file is used to create an inference session once. The runtime validates model metadata and prepares execution resources, then repeatedly passes preprocessed tensors to session.run and postprocesses output tensors.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .note { font-size: 14px; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="550" fill="#fff"/>
  <text x="40" y="45" class="title">ONNX Runtime: initialize once, infer repeatedly</text>
  <rect x="385" y="72" width="230" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="108" text-anchor="middle" class="head">ONNX model file</text>
  <line x1="500" y1="132" x2="500" y2="157" class="arrow"/>
  <rect x="325" y="164" width="350" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="193" text-anchor="middle" class="head">Create InferenceSession</text>
  <text x="500" y="216" text-anchor="middle" class="note">once at program startup</text>
  <path d="M500 234V252H265V268M500 252H735V268" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="265" y1="252" x2="265" y2="263" class="arrow"/>
  <line x1="735" y1="252" x2="735" y2="263" class="arrow"/>
  <rect x="90" y="272" width="350" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="560" y="272" width="350" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="265" y="305" text-anchor="middle" class="head">Validate runtime metadata</text>
  <text x="265" y="332" text-anchor="middle" class="note">input name, shape, and data type</text>
  <text x="735" y="305" text-anchor="middle" class="head">Prepare execution resources</text>
  <text x="735" y="332" text-anchor="middle" class="note">graph plan and intermediate buffers</text>
  <path d="M265 360V380H500M735 360V380H500V397" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="382" x2="500" y2="392" class="arrow"/>
  <rect x="35" y="405" width="930" height="112" rx="14" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="55" y="432" class="head">Per-frame inference loop</text>
  <rect x="60" y="449" width="190" height="48" rx="8" fill="#fff" stroke="#94a3b8"/>
  <rect x="295" y="449" width="175" height="48" rx="8" fill="#fff" stroke="#3b82f6"/>
  <rect x="515" y="449" width="175" height="48" rx="8" fill="#fff" stroke="#3b82f6"/>
  <rect x="735" y="449" width="190" height="48" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="155" y="479" text-anchor="middle" class="label">Preprocessed tensor</text>
  <text x="382" y="479" text-anchor="middle" class="label">session.run()</text>
  <text x="602" y="479" text-anchor="middle" class="label">Output tensor</text>
  <text x="830" y="479" text-anchor="middle" class="label">Postprocess</text>
  <line x1="254" y1="473" x2="287" y2="473" class="arrow"/>
  <line x1="474" y1="473" x2="507" y2="473" class="arrow"/>
  <line x1="694" y1="473" x2="727" y2="473" class="arrow"/>
  <text x="40" y="540" class="note">Reuse the same session for each frame; execution settings are fixed when the session is created.</text>
</svg>

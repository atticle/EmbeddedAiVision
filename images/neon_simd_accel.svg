<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">NEON vector lanes for FP32 and INT8 data</title>
  <desc id="desc">A 128-bit vector contains four 32-bit values or sixteen 8-bit values. Lane capacity alone does not determine end-to-end inference speed.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 19px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .note { font-size: 14px; fill: #475569; }
    </style>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="40" y="45" class="title">One 128-bit NEON vector, different data widths</text>
  <rect x="40" y="72" width="440" height="276" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <rect x="520" y="72" width="440" height="276" rx="14" fill="#f7fef9" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="72" width="440" height="52" rx="14" fill="#dbeafe"/>
  <rect x="520" y="72" width="440" height="52" rx="14" fill="#dcfce7"/>
  <text x="62" y="105" class="head">FP32: 4 lanes x 32 bits</text>
  <text x="542" y="105" class="head">INT8: 16 lanes x 8 bits</text>
  <g fill="#eff6ff" stroke="#3b82f6">
    <rect x="76" y="166" width="84" height="74" rx="7"/>
    <rect x="172" y="166" width="84" height="74" rx="7"/>
    <rect x="268" y="166" width="84" height="74" rx="7"/>
    <rect x="364" y="166" width="84" height="74" rx="7"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="118" y="208">FP32</text><text x="214" y="208">FP32</text>
    <text x="310" y="208">FP32</text><text x="406" y="208">FP32</text>
  </g>
  <text x="260" y="278" text-anchor="middle" class="label">4 values fit in 128 bits</text>
  <text x="260" y="308" text-anchor="middle" class="note">one 32-bit value per lane</text>
  <g fill="#ecfdf5" stroke="#22c55e">
    <rect x="542" y="166" width="22" height="74" rx="3"/><rect x="568" y="166" width="22" height="74" rx="3"/>
    <rect x="594" y="166" width="22" height="74" rx="3"/><rect x="620" y="166" width="22" height="74" rx="3"/>
    <rect x="646" y="166" width="22" height="74" rx="3"/><rect x="672" y="166" width="22" height="74" rx="3"/>
    <rect x="698" y="166" width="22" height="74" rx="3"/><rect x="724" y="166" width="22" height="74" rx="3"/>
    <rect x="750" y="166" width="22" height="74" rx="3"/><rect x="776" y="166" width="22" height="74" rx="3"/>
    <rect x="802" y="166" width="22" height="74" rx="3"/><rect x="828" y="166" width="22" height="74" rx="3"/>
    <rect x="854" y="166" width="22" height="74" rx="3"/><rect x="880" y="166" width="22" height="74" rx="3"/>
    <rect x="906" y="166" width="22" height="74" rx="3"/><rect x="932" y="166" width="22" height="74" rx="3"/>
  </g>
  <text x="740" y="278" text-anchor="middle" class="label">16 values fit in 128 bits</text>
  <text x="740" y="308" text-anchor="middle" class="note">one 8-bit value per lane</text>
  <text x="40" y="386" class="note">This shows vector lane capacity only. Actual throughput depends on kernels, memory access, and other bottlenecks.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Cloud and on-device inference paths</title>
  <desc id="desc">Comparison of the data path and engineering trade-offs for cloud and on-device inference.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .note { font-size: 15px; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="40" y="46" class="title">Where does inference run?</text>
  <rect x="40" y="72" width="440" height="205" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <rect x="520" y="72" width="440" height="205" rx="14" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <path d="M40 86a14 14 0 0 1 14-14h412a14 14 0 0 1 14 14v38H40Z" fill="#dbeafe"/>
  <path d="M520 86a14 14 0 0 1 14-14h412a14 14 0 0 1 14 14v38H520Z" fill="#dcfce7"/>
  <text x="60" y="107" class="head">Cloud / server inference</text>
  <text x="540" y="107" class="head">On-device / edge inference</text>
  <rect x="56" y="157" width="112" height="62" rx="9" fill="#fff" stroke="#93c5fd"/>
  <rect x="210" y="157" width="112" height="62" rx="9" fill="#fff" stroke="#93c5fd"/>
  <rect x="364" y="157" width="96" height="62" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="112" y="183" text-anchor="middle" class="label">Camera</text>
  <text x="112" y="205" text-anchor="middle" class="note">frame</text>
  <text x="266" y="183" text-anchor="middle" class="label">Remote</text>
  <text x="266" y="205" text-anchor="middle" class="note">model</text>
  <text x="412" y="183" text-anchor="middle" class="label">Result</text>
  <line x1="174" y1="188" x2="202" y2="188" class="arrow"/>
  <line x1="328" y1="188" x2="356" y2="188" class="arrow"/>
  <rect x="536" y="157" width="112" height="62" rx="9" fill="#fff" stroke="#86efac"/>
  <rect x="690" y="157" width="112" height="62" rx="9" fill="#fff" stroke="#86efac"/>
  <rect x="844" y="157" width="96" height="62" rx="9" fill="#fff" stroke="#86efac"/>
  <text x="592" y="183" text-anchor="middle" class="label">Camera</text>
  <text x="592" y="205" text-anchor="middle" class="note">frame</text>
  <text x="746" y="183" text-anchor="middle" class="label">Local</text>
  <text x="746" y="205" text-anchor="middle" class="note">model</text>
  <text x="892" y="183" text-anchor="middle" class="label">Result</text>
  <line x1="654" y1="188" x2="682" y2="188" class="arrow"/>
  <line x1="808" y1="188" x2="836" y2="188" class="arrow"/>
  <rect x="40" y="300" width="440" height="94" rx="12" fill="#eff6ff"/>
  <rect x="520" y="300" width="440" height="94" rx="12" fill="#f0fdf4"/>
  <text x="62" y="332" class="label">Consider network availability, bandwidth, and data handling.</text>
  <text x="62" y="360" class="note">Remote compute can reduce work on the device.</text>
  <text x="542" y="332" class="label">Consider compute, memory, latency, power, and cooling.</text>
  <text x="542" y="360" class="note">Local inference can continue without a network connection.</text>
</svg>
